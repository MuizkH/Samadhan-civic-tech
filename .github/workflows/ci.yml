name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: samadhan
          POSTGRES_PASSWORD: samadhan
          POSTGRES_DB: samadhan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samadhan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests run against the service container above, never the dev database.
      TEST_DATABASE_URL: "postgresql://samadhan:samadhan@localhost:5432/samadhan_test?schema=public"
      # Must differ from TEST_DATABASE_URL — tests/setup.ts refuses to run if they match.
      # The test suite swaps DATABASE_URL → TEST_DATABASE_URL before any query runs,
      # so this value never touches a real DB during tests.
      DATABASE_URL: "postgresql://samadhan:samadhan@localhost:5432/samadhan?schema=public"
      # schema.prisma declares directUrl; prisma migrate deploy fails without it.
      # In CI there is no connection pooler, so DIRECT_URL == TEST_DATABASE_URL.
      DIRECT_URL: "postgresql://samadhan:samadhan@localhost:5432/samadhan_test?schema=public"
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-tests
      NODE_ENV: test
      CORS_ORIGIN: "http://localhost:8080"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
      - name: Format check
        run: npm run format:check
        working-directory: backend
      - name: Lint
        run: npm run lint
        working-directory: backend
      - name: Typecheck + build
        run: npm run build
        working-directory: backend
      - name: Run migrations against test DB
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://samadhan:samadhan@localhost:5432/samadhan_test?schema=public"
      - name: Test
        run: npm test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format check
        run: npm run format:check
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Test
        run: npm run test
        working-directory: frontend
      # `npm run build` also prerenders, which needs a Chrome binary. Run the
      # plain Vite build here and leave prerendering to the deploy step.
      - name: Build
        run: npx vite build
        working-directory: frontend
